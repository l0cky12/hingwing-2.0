# npm version bumps are left out: desktop dependencies are pinned on purpose.
# npm security fixes come from Dependabot security updates in the repo settings.
version: 2
updates:
  # The workflows pin actions to commit SHAs, so this is what moves them forward.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
