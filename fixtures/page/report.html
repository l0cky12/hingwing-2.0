<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign-ups report</title>
<style>
  body { margin: 0; padding: 40px; font: 16px/1.5 sans-serif; color: #1d2320; background: #fbfaf5; }
  h1 { margin: 0 0 4px; font-size: 32px; }
  .lede { margin: 0 0 28px; color: #5b625e; }
  .tiles { display: flex; gap: 16px; margin-bottom: 28px; }
  .tile { flex: 1; padding: 16px 20px; border: 1px solid #d9d6cb; border-radius: 10px; background: #fff; }
  .tile b { display: block; font-size: 28px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 8px 12px; border-bottom: 1px solid #e4e1d7; text-align: left; }
  td.n { text-align: right; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<h1>Weekly sign-ups</h1>
<p class="lede">Week of 16 November, from the sign-up log.</p>
<div class="tiles">
  <div class="tile"><b>1,284</b>New accounts</div>
  <div class="tile"><b>+12%</b>On last week</div>
  <div class="tile"><b>Tuesday</b>Busiest day</div>
</div>
<table>
  <thead><tr><th>Day</th><th>Sign-ups</th></tr></thead>
  <tbody>
    <tr><td>Monday</td><td class="n">171</td></tr>
    <tr><td>Tuesday</td><td class="n">243</td></tr>
    <tr><td>Wednesday</td><td class="n">198</td></tr>
    <tr><td>Thursday</td><td class="n">207</td></tr>
    <tr><td>Friday</td><td class="n">188</td></tr>
    <tr><td>Saturday</td><td class="n">139</td></tr>
    <tr><td>Sunday</td><td class="n">138</td></tr>
  </tbody>
</table>
</body>
</html>
